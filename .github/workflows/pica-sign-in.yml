name: 哔咔自动签到

on:
  schedule:
    - cron: '0 0 * * *' # 这里可以改成你想要的时间
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖 (Pip)
        run: |
          python -m pip install --upgrade pip
          pip install httpx  # 哔咔签到主要只需要 httpx
          pip install requests # 备用网络库

      - name: 运行签到脚本
        env:
          COOKIE: ${{ secrets.COOKIE }} # 必须在仓库设置里添加这个密钥
        run: python sign_in.py
